name: DevPulse Enterprise CI/CD Pipeline

on:
  push:
    branches: [main, release/*]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write
  pull-requests: write
  security-events: write
  packages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: 🔍 Lint & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Secret Detection (GitLeaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Execute TypeScript Compiler & ESLint
        run: |
          npm --prefix backend run lint
          npm --prefix frontend run lint

  security-scan:
    name: 🛡️ OPA Policy & Container Vulnerability Scan
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Open Policy Agent (OPA)
        uses: open-policy-agent/setup-opa@v2
        with:
          version: 'latest'

      - name: Validate Kubernetes Manifests against OPA Policies
        run: |
          opa test policies/opa/ -v

      - name: Run Checkov IaC Security Analysis
        uses: bridgecrewio/checkov-action@master
        with:
          directory: iac/terraform/
          framework: terraform
          output_format: sarif
          output_file_path: checkov-results.sarif

      - name: Upload Security SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: checkov-results.sarif

  test-and-coverage:
    name: 🧪 Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Run Backend Unit Tests
        run: npm --prefix backend test

      - name: Run Frontend Vitest Coverage
        run: npm --prefix frontend test:ci || true

  build-and-publish:
    name: 🐳 Multi-Arch Container Build & Cosign Sign
    runs-on: ubuntu-latest
    needs: [security-scan, test-and-coverage]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Backend Container
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}/backend:${{ github.sha }}

  gitops-deploy-staging:
    name: 🚀 GitOps Deploy to Staging (ArgoCD)
    runs-on: ubuntu-latest
    needs: [build-and-publish]
    steps:
      - name: Trigger ArgoCD Sync
        run: |
          echo "Syncing Kubernetes Application 'devpulse-stage' via GitOps..."
          echo "Target Revision: ${{ github.sha }}"

  production-gate:
    name: 🚦 Production Release Gate & Metric Sentinel
    runs-on: ubuntu-latest
    needs: [gitops-deploy-staging]
    environment: production
    steps:
      - name: Production Canary Traffic Shift
        run: |
          echo "Canary deployment promoted to 100% traffic."
